<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- keywords used when searching for website-->
    <meta name="keywords" content="personal website">

    <!--Author of code-->
    <meta name="Author" content="Nat Krah">

    <!--Title of webpage-->
    <title>nat-krah | customize</title>

    <!--Add an faveicon-->
    <link rel="icon" href="../assets/faveicon.svg" sizes="any" >
    <link id="faveicon" rel="icon" href="../assets/faveicon.svg" type="image/svg+xml">

    <!--Linking the css and js file-->
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="webpage-custimization-styles.css">
    <script defer src="webpage-custimization.script.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>

</head>

<body>
    <div class="wrapper">
        <header>
            <a href="../index.html">
                <button id="homeselect" class="home btn" aria-label="nat-krah">
                    <i class="home-icon" data-feather="settings"></i>
                    <h1 class="home-text">nat-krah</h1>
                </button>
            </a>
            <button id="theme-toggle" aria-label="Toggle Theme">
                <i data-feather="power"></i>
            </button>
        </header>


        <main>
            <div class="color-select">
                <div>
                    <div class="sliders">
                        <input type="range" min="1" max="100" value="50" class="slider" id="saturation">
                        <input type="range" min="1" max="100" value="50" class="slider" id="temperature">
                    </div>
                    <div class="squares">
                        <div class="cards">
                            <div class="card btn">
                                <h3>Contrast</h3>
                                <p>Mix sharper headings with muted text</p>
                            </div>
                            <div class="card btn">
                                <h3>Gradients</h3>
                                <p>Play with gradient background</p>
                            </div>

                            <!--What would be cool is to include buttons for pdf, html, certificats-->
                            <div class="card btn">
                                <h3>Highlight</h3>
                                <p>Use a lighter border to simulate light</p>
                            </div>

                            <div class="card btn">
                                <h3>Shadows</h3>
                                <p>Shadows to add depth</p>
                            </div>
                            </ul>
                        </div>
                    </div>
                    <button>
                        Show Code
                    </button>
                </div>
            </div>
            
            <div class="pallet-display">
                <div class="section">
                    <h2>Background</h2>
                    <div class="section-pallet-container">
                        <div id="bg-dark" class="single-pallet-container">
                            <div class="pallet"></div>
                            <p>bg-dark</p>
                        </div>
                        <div id="bg" class="single-pallet-container">
                            <div class="pallet"></div>
                            <p>bg</p>
                        </div>
                        <div id="bg-light" class="single-pallet-container">
                            <div class="pallet"></div>
                            <p>bg-light</p>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>Text</h2>
                    <div class="section-pallet-container">
                        <div id="text" class="single-pallet-container">
                            <div class="pallet"></div>
                            <p>text</p>
                        </div>
                        <div id="text-muted" class="single-pallet-container">
                            <div class="pallet"></div>
                            <p>text-muted</p>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>Border</h2>
                    <div class="section-pallet-container">
                        <div id="highlight" class="single-pallet-container">
                            <div class="pallet"></div>
                            <p>highlight</p>
                        </div>
                        <div id="border" class="single-pallet-container">
                            <div class="pallet"></div>
                            <p>border</p>
                        </div>
                         <div id="border-muted" class="single-pallet-container">
                            <div class="pallet"></div>
                            <p>border-muted</p>
                        </div>
                    </div>
                </div>

            </div>


        </main>

        <footer>
            <ul class="footer-items">
                <li><a href="../index.html"><i data-feather="home" class="footer-icon"></i></a></li>
                <li><a href="https://github.com/nat-krah" target="_blank"><i data-feather="github" class="footer-icon"></i></a></li>
                <li><a href="https://www.linkedin.com/in/nat-krah/" target="_blank"><i data-feather="linkedin" class="footer-icon"></i></a></li>
                <li><a href="mailto:nicholaskrah1@gmail.com" target="_blank"><i data-feather="mail" class="footer-icon"></i></a></li>
            </ul>
        </footer>
    </div>
    
    

    <script>
      feather.replace();
    </script>
</body>
</html>
